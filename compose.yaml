# Linux containers only. Windows Server 2022 uses deploy/windows scripts instead.
name: creator-studio
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: creator_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD:?Set PG_ADMIN_PASSWORD in a private env file}
      APP_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in a private env file}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/init-db.sql:/docker-entrypoint-initdb.d/01-app.sql:ro
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U creator_admin -d postgres']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: &logging
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://creator_app:${DB_PASSWORD}@db:5432/creator_studio
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to your HTTPS origin}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-creator}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set a private initial administrator password}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    networks: [database, application]
    depends_on: { db: { condition: service_healthy } }
    logging: *logging
  web:
    build: { context: ., dockerfile: Dockerfile }
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS to your domain}
    ports: ['80:80', '443:443']
    volumes: [caddydata:/data, caddyconfig:/config]
    networks: [application, public]
    depends_on: { api: { condition: service_healthy } }
    logging: *logging
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: creator_app
      PGDATABASE: creator_studio
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ./deploy/backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ['/bin/sh', '/backup.sh']
    networks: [database]
    depends_on: { api: { condition: service_healthy } }
    logging: *logging
networks:
  database: { internal: true }
  application: { internal: true }
  public: {}
volumes:
  pgdata:
  caddydata:
  caddyconfig:
